<!DOCTYPE html>
<!--
  SANKALP COMPUTER CLASSES — Certificate Verification (public page)
  ------------------------------------------------------------
  This page is PUBLIC — anyone with the link can check a certificate.
  It does not need a password, and it never exposes the full list of
  certificates — only the single result matching the ID someone enters.

  SETUP: WEB_APP_URL below is already filled in from your Apps Script
  deployment (same one used by shivam.html). If you ever redeploy the
  script and get a new URL, update it in both files.
------------------------------------------------------------- -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate — Sankalp Computer Classes</title>
<meta name="description" content="Verify a certificate issued by Sankalp Computer Classes, Bidhuna, Auraiya.">
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132038; --ink-soft:#2b3a58; --paper:#f6f4ee; --card:#ffffff;
    --gold:#d99a1f; --gold-dark:#b87f14; --teal:#0f6f6c; --teal-dark:#0b524f;
    --line:#e1ddd0; --radius:14px; --shadow:0 10px 30px -18px rgba(19,32,56,0.35);
    --ok:#1c7c4d; --danger:#b3432f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--ink); color:var(--ink);
    font-family:"Source Sans 3", system-ui, sans-serif; line-height:1.6;
    display:flex; align-items:center; justify-content:center; padding:40px 20px;
    background:
      radial-gradient(650px 340px at 85% 10%, rgba(217,154,31,0.18), transparent 60%),
      radial-gradient(560px 300px at 100% 100%, rgba(15,111,108,0.28), transparent 60%),
      var(--ink);
  }
  h1,h2,h3{font-family:"Space Grotesk", system-ui, sans-serif; margin:0; color:var(--ink);}
  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:0 20px 60px rgba(0,0,0,0.35);
    max-width:520px; width:100%; padding:36px 32px;
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  .brand img{width:46px; height:46px; border-radius:10px; background:var(--ink);}
  .brand strong{font-family:"Space Grotesk"; font-size:1.05rem; color:var(--ink); display:block;}
  .brand span{font-size:.8rem; color:var(--ink-soft);}
  h1{font-size:1.4rem; margin-bottom:6px;}
  p.lede{color:var(--ink-soft); font-size:.95rem; margin:0 0 24px;}

  .search-row{display:flex; gap:10px; margin-bottom:6px;}
  input#certInput{
    flex:1; padding:13px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:1rem; font-family:inherit;
  }
  input#certInput:focus{outline:none; border-color:var(--teal);}
  button#verifyBtn{
    background:var(--teal); color:#fff; border:none; padding:13px 22px;
    border-radius:10px; font-weight:700; font-size:.95rem; cursor:pointer; font-family:inherit;
    white-space:nowrap;
  }
  button#verifyBtn:hover{background:var(--teal-dark);}
  button#verifyBtn:disabled{opacity:.6; cursor:default;}
  .hint{font-size:.8rem; color:var(--ink-soft); margin:8px 0 0;}

  .result{margin-top:26px; display:none;}
  .result.show{display:block;}
  .result-card{
    border-radius:12px; padding:22px; border:1px solid var(--line);
  }
  .result-card.valid{background:#eaf7f0; border-color:#bfe4cf;}
  .result-card.invalid{background:#fbeae6; border-color:#f0c4b8;}
  .result-icon{font-size:1.6rem; margin-bottom:8px;}
  .result-title{font-family:"Space Grotesk"; font-size:1.1rem; margin-bottom:4px;}
  .result-card.valid .result-title{color:var(--ok);}
  .result-card.invalid .result-title{color:var(--danger);}
  .result-sub{font-size:.88rem; color:var(--ink-soft); margin-bottom:14px;}
  .detail-row{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px dashed var(--line); font-size:.9rem;}
  .detail-row:first-of-type{border-top:none;}
  .detail-row .label{color:var(--ink-soft); font-weight:600;}
  .detail-row .value{color:var(--ink); font-weight:700; text-align:right;}

  .footer-note{margin-top:24px; font-size:.78rem; color:var(--ink-soft); text-align:center;}
  .footer-note a{color:var(--teal-dark);}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="logo.png" alt="" onerror="this.style.background='var(--ink)'; this.src='';">
    <div>
      <strong>Sankalp Computer Classes</strong>
      <span>Certificate verification</span>
    </div>
  </div>

  <h1>Verify a certificate</h1>
  <p class="lede">Enter the Certificate ID printed on the certificate to confirm it was issued by us.</p>

  <div class="search-row">
    <input type="text" id="certInput" placeholder="e.g. SCC-2026-001" autocomplete="off">
    <button id="verifyBtn" onclick="verifyCertificate()">Verify</button>
  </div>
  <p class="hint">The Certificate ID is printed near the bottom of your certificate.</p>

  <div class="result" id="resultBox">
    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      <div id="resultDetails"></div>
    </div>
  </div>

  <p class="footer-note">Sankalp Computer Classes, Bidhuna, Auraiya, UP — 206243 &middot; <a href="tel:+919286733232">92867 33232</a></p>
</div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxf7m3cgFy3KKi0L6H3JT0Y5s7Dk4PtOkMMnhzIy5y3CP2pbVWuIj9jn01P7dV_ZQ/exec';

  document.getElementById('certInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') verifyCertificate();
  });

  function formatDate(val){
    if (!val) return '—';
    const d = new Date(val);
    if (isNaN(d.getTime())) return String(val);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }

  async function verifyCertificate(){
    const id = document.getElementById('certInput').value.trim();
    const btn = document.getElementById('verifyBtn');
    const box = document.getElementById('resultBox');
    if (!id){
      document.getElementById('certInput').focus();
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Checking…';
    box.classList.remove('show');

    try{
      const res = await fetch(WEB_APP_URL + '?action=verify&id=' + encodeURIComponent(id));
      const data = await res.json();
      showResult(data, id);
    } catch(err){
      showResult({ found: false, networkError: true }, id);
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Verify';
    }
  }

  function showResult(data, queriedId){
    const box = document.getElementById('resultBox');
    const card = document.getElementById('resultCard');
    const icon = document.getElementById('resultIcon');
    const title = document.getElementById('resultTitle');
    const sub = document.getElementById('resultSub');
    const details = document.getElementById('resultDetails');

    box.classList.add('show');

    if (data.networkError){
      card.className = 'result-card invalid';
      icon.textContent = '⚠️';
      title.textContent = 'Could not check right now';
      sub.textContent = 'Please check your internet connection and try again.';
      details.innerHTML = '';
      return;
    }

    if (data.found){
      const isRevoked = String(data.status || '').toLowerCase().includes('revoke');
      card.className = 'result-card ' + (isRevoked ? 'invalid' : 'valid');
      icon.textContent = isRevoked ? '⚠️' : '✅';
      title.textContent = isRevoked ? 'Certificate revoked' : 'Valid certificate';
      sub.textContent = isRevoked
        ? 'This certificate ID was issued but has since been revoked.'
        : 'This certificate was issued by Sankalp Computer Classes.';
      details.innerHTML = `
        <div class="detail-row"><span class="label">Certificate ID</span><span class="value">${data.certificateId || '—'}</span></div>
        <div class="detail-row"><span class="label">Student name</span><span class="value">${data.name || '—'}</span></div>
        <div class="detail-row"><span class="label">Course</span><span class="value">${data.course || '—'}</span></div>
        <div class="detail-row"><span class="label">Issue date</span><span class="value">${formatDate(data.issueDate)}</span></div>
      `;
    } else {
      card.className = 'result-card invalid';
      icon.textContent = '❌';
      title.textContent = 'Certificate not found';
      sub.textContent = `No certificate matches ID "${queriedId}". Please check the ID and try again, or contact us.`;
      details.innerHTML = '';
    }
  }
</script>

</body>
</html>
